      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </g>
  </g>

  <text x="300" y="245" fill="#f5f5f5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">Physics-Informed ML</text>
  <text x="300" y="278" fill="#8a8a8a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Renewable Forecasting • ICMLC 2026 Presentation</text>

  <g transform="translate(260, 312)">
