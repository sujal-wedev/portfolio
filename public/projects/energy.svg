  <circle cx="300" cy="120" r="180" fill="url(#glow-energy)"/>
  <rect width="598" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g transform="translate(40, 40)">
    <rect width="110" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="55" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.08em">RESEARCH</text>
  </g>

  <g transform="translate(260, 95)">
